name: Security and application checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run install:all
      - run: npm test
      - name: Audit runtime dependencies for every desktop app
        shell: pwsh
        run: |
          foreach ($folder in @("Librarian's End", "Admin's End", "Control Center")) {
            npm --prefix $folder audit --omit=dev
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: npm install --global firebase-tools@15.31.0
      - run: npm run test:rules
      - run: npm run build:win
